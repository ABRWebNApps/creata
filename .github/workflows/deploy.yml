name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy via API
        env:
          VERCEL_TOKEN: vcp_2lkhk5CmsitAayP0Qicv65tUt8Y5AnUO6HEnKJZdemwc4dwF4j4HbLX1
        run: |
          URL="https://api.vercel.com/v1/integrations/deploy/prj_0Y6ZrscONANavsTm6EL1Zor6UPjD/aqPgQgCCp2"
          RESPONSE=$(curl -s -X POST "$URL" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Content-Type: application/json")
          echo "${RESPONSE}"
          DEPLOY_ID=$(echo "${RESPONSE}" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -z "${DEPLOY_ID}" ]; then
            echo "FAILED"
            exit 1
          fi
          echo "Deploy ID: ${DEPLOY_ID}"
